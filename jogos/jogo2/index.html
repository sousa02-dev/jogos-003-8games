<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Racer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            max-width: 100vw;
            max-height: 100vh;
        }
        canvas {
            display: block;
            background: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 14px;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            z-index: 10;
        }
        .ui-bar {
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            margin: 3px 0;
            border: 2px solid #00ffff;
        }
        .bar-fill {
            height: 10px;
            background: linear-gradient(90deg, #00ff00, #ffff00, #ff0000);
            transition: width 0.3s;
        }
        #shootBtn {
            position: absolute;
            right: 20px;
            bottom: 80px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ff0000, #aa0000);
            border: 4px solid #fff;
            border-radius: 50%;
            font-size: 40px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            z-index: 15;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        #shootBtn:active {
            background: radial-gradient(circle, #ffaa00, #ff6600);
            transform: scale(0.9);
        }
        #boostBtn {
            position: absolute;
            right: 120px;
            bottom: 80px;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #00aaff, #0066aa);
            border: 4px solid #fff;
            border-radius: 50%;
            font-size: 30px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            z-index: 15;
            box-shadow: 0 0 20px rgba(0,170,255,0.5);
        }
        #boostBtn:active {
            background: radial-gradient(circle, #00ffff, #00aaff);
            transform: scale(0.9);
        }
        #boostBtn.cooldown {
            background: #555;
            opacity: 0.5;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 15;
        }
        .control-btn {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.3);
            border: 3px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            color: white;
            user-select: none;
            touch-action: none;
        }
        .control-btn:active {
            background: rgba(255,255,255,0.5);
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 30px;
            border: 4px solid #00ffff;
            color: #00ffff;
            text-align: center;
            display: none;
            z-index: 20;
        }
        #gameOver h2 {
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ffff;
        }
        #gameOver button {
            background: #00ffff;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            margin-top: 20px;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div class="ui-bar">
                <div>PONTOS: <span id="score">0</span></div>
            </div>
            <div class="ui-bar">
                <div>ESCUDO</div>
                <div style="background: rgba(255,255,255,0.3); width: 150px;">
                    <div id="shieldBar" class="bar-fill" style="width: 100%; background: #00ffff;"></div>
                </div>
            </div>
            <div class="ui-bar">
                <div>BOOST</div>
                <div style="background: rgba(255,255,255,0.3); width: 150px;">
                    <div id="boostBar" class="bar-fill" style="width: 100%; background: #ffaa00;"></div>
                </div>
            </div>
        </div>
        <button id="shootBtn">🔥</button>
        <button id="boostBtn">⚡</button>
        <div class="controls">
            <div class="control-btn" id="leftBtn">←</div>
            <div class="control-btn" id="upBtn">↑</div>
            <div class="control-btn" id="downBtn">↓</div>
            <div class="control-btn" id="rightBtn">→</div>
        </div>
        <div id="gameOver">
            <h2>GAME OVER</h2>
            <div id="finalScore"></div>
            <button onclick="restartGame()">JOGAR NOVAMENTE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            const maxW = window.innerWidth;
            const maxH = window.innerHeight;
            const ratio = 9/16;
            
            if (maxW / maxH > ratio) {
                canvas.height = maxH;
                canvas.width = maxH * ratio;
            } else {
                canvas.width = maxW;
                canvas.height = maxW / ratio;
            }
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgMusicPlaying = false;
        
        function playSound(freq, duration, type = 'square', volume = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function shootSound() {
            playSound(600, 0.1, 'square');
        }

        function explosionSound() {
            playSound(80, 0.4, 'sawtooth', 0.15);
        }

        function powerUpSound() {
            playSound(800, 0.1);
            setTimeout(() => playSound(1200, 0.2), 100);
        }

        function boostSound() {
            playSound(200, 0.3, 'sawtooth');
        }

        function playBackgroundMusic() {
            if (bgMusicPlaying) return;
            bgMusicPlaying = true;
            
            const notes = [523, 587, 659, 698, 784, 880, 988, 1047];
            const rhythm = [0.3, 0.3, 0.2, 0.2, 0.3, 0.3, 0.4, 0.4];
            let index = 0;
            
            function playNote() {
                if (!bgMusicPlaying) return;
                playSound(notes[index % notes.length], rhythm[index % rhythm.length], 'triangle', 0.03);
                index++;
                setTimeout(playNote, rhythm[(index - 1) % rhythm.length] * 1000);
            }
            playNote();
        }

        let gameState = {
            score: 0,
            gameOver: false,
            scrollY: 0,
            scrollSpeed: 3,
            shield: 100,
            maxShield: 100,
            boostEnergy: 100,
            maxBoostEnergy: 100,
            boosting: false,
            boostCooldown: 0
        };

        const player = {
            x: 0,
            y: 0,
            width: 24,
            height: 32,
            speed: 5,
            moveLeft: false,
            moveRight: false,
            moveUp: false,
            moveDown: false,
            hasShield: true,
            weapon: 'normal'
        };

        let bullets = [];
        let obstacles = [];
        let powerUps = [];
        let particles = [];
        let explosions = [];

        const keys = {};
        
        window.addEventListener('keydown', (e) => { keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key] = false; });

        let touchX = null, touchY = null;
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            touchX = ((touch.clientX - rect.left) / rect.width) * canvas.width;
            touchY = ((touch.clientY - rect.top) / rect.height) * canvas.height;
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            touchX = ((touch.clientX - rect.left) / rect.width) * canvas.width;
            touchY = ((touch.clientY - rect.top) / rect.height) * canvas.height;
        });
        
        canvas.addEventListener('touchend', () => {
            touchX = null;
            touchY = null;
        });

        document.getElementById('leftBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            player.moveLeft = true;
        });
        document.getElementById('leftBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            player.moveLeft = false;
        });
        
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            player.moveRight = true;
        });
        document.getElementById('rightBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            player.moveRight = false;
        });

        document.getElementById('upBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            player.moveUp = true;
        });
        document.getElementById('upBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            player.moveUp = false;
        });

        document.getElementById('downBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            player.moveDown = true;
        });
        document.getElementById('downBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            player.moveDown = false;
        });

        let shooting = false;
        document.getElementById('shootBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            shooting = true;
        });
        document.getElementById('shootBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            shooting = false;
        });
        document.getElementById('shootBtn').addEventListener('mousedown', (e) => {
            e.preventDefault();
            shooting = true;
        });
        document.getElementById('shootBtn').addEventListener('mouseup', (e) => {
            e.preventDefault();
            shooting = false;
        });

        document.getElementById('boostBtn').addEventListener('click', (e) => {
            e.preventDefault();
            activateBoost();
        });

        function drawPlayer() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x - 6, player.y, 12, 20);
            ctx.fillRect(player.x - 12, player.y + 10, 24, 8);
            
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(player.x - 4, player.y + 4, 8, 6);
            
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(player.x - 8, player.y + 20, 4, 8);
            ctx.fillRect(player.x + 4, player.y + 20, 4, 8);
            
            ctx.fillStyle = gameState.boosting ? '#00ffff' : '#ffaa00';
            ctx.fillRect(player.x - 8, player.y + 28, 4, 6);
            ctx.fillRect(player.x + 4, player.y + 28, 4, 6);
            
            if (player.hasShield && gameState.shield > 0) {
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(player.x, player.y + 12, 20, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function spawnObstacle() {
            const trackWidth = canvas.width * 0.4;
            const trackStart = canvas.width * 0.3;
            
            obstacles.push({
                x: trackStart + Math.random() * (trackWidth - 40),
                y: -40,
                width: 32,
                height: 32,
                hp: 3,
                maxHp: 3,
                type: Math.random() > 0.7 ? 'armored' : 'normal'
            });
        }

        function drawObstacle(obs) {
            ctx.fillStyle = obs.type === 'armored' ? '#666666' : '#0066cc';
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            
            const centerSize = 12;
            ctx.fillStyle = '#000';
            ctx.fillRect(obs.x + (obs.width - centerSize)/2, obs.y + (obs.height - centerSize)/2, centerSize, centerSize);
            
            ctx.fillStyle = obs.hp === obs.maxHp ? '#ff6600' : '#ffaa00';
            ctx.beginPath();
            ctx.arc(obs.x + obs.width/2, obs.y + obs.height/2, 5, 0, Math.PI * 2);
            ctx.fill();
            
            if (obs.hp < obs.maxHp) {
                const barWidth = obs.width;
                const barHeight = 3;
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(obs.x, obs.y - 6, barWidth, barHeight);
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(obs.x, obs.y - 6, barWidth * (obs.hp / obs.maxHp), barHeight);
            }
        }

        function spawnPowerUp(x, y) {
            const types = ['shield', 'boost', 'weapon'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            powerUps.push({ x, y, width: 20, height: 20, type, rotation: 0 });
        }

        function drawPowerUp(pu) {
            ctx.save();
            ctx.translate(pu.x, pu.y);
            ctx.rotate(pu.rotation);
            
            if (pu.type === 'shield') {
                ctx.fillStyle = '#00ffff';
                ctx.strokeStyle = '#0088aa';
            } else if (pu.type === 'boost') {
                ctx.fillStyle = '#ffaa00';
                ctx.strokeStyle = '#aa6600';
            } else {
                ctx.fillStyle = '#ff0000';
                ctx.strokeStyle = '#aa0000';
            }
            
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(8, 8);
            ctx.lineTo(-8, 8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            ctx.restore();
        }

        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 30,
                    color
                });
            }
        }

        function createExplosion(x, y, big = false) {
            explosions.push({
                x, y,
                frame: 0,
                maxFrame: big ? 30 : 20,
                size: big ? 60 : 40
            });
            explosionSound();
            createParticles(x, y, big ? 20 : 10, '#ffaa00');
        }

        let shootTimer = 0;
        function shoot() {
            if (player.weapon === 'triple') {
                bullets.push(
                    { x: player.x, y: player.y, width: 4, height: 12, speed: 10, damage: 1 },
                    { x: player.x - 10, y: player.y, width: 4, height: 12, speed: 10, damage: 1 },
                    { x: player.x + 10, y: player.y, width: 4, height: 12, speed: 10, damage: 1 }
                );
            } else {
                bullets.push({ x: player.x, y: player.y, width: 4, height: 12, speed: 10, damage: 1 });
            }
            shootSound();
        }

        function activateBoost() {
            if (gameState.boostEnergy >= 30 && gameState.boostCooldown <= 0) {
                gameState.boosting = true;
                gameState.boostCooldown = 60;
                boostSound();
                setTimeout(() => { gameState.boosting = false; }, 1000);
            }
        }

        function checkCollision(a, b) {
            return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
        }

        let frame = 0;
        function update() {
            if (gameState.gameOver) return;

            frame++;
            gameState.scrollY += gameState.scrollSpeed;

            // if (frame === 10) playBackgroundMusic(); // Música de fundo desativada

            const speed = gameState.boosting ? player.speed * 2 : player.speed;
            
            if (keys['ArrowLeft'] || keys['a'] || player.moveLeft) player.x -= speed;
            if (keys['ArrowRight'] || keys['d'] || player.moveRight) player.x += speed;
            if (keys['ArrowUp'] || keys['w'] || player.moveUp) player.y -= speed;
            if (keys['ArrowDown'] || keys['s'] || player.moveDown) player.y += speed;
            
            if (touchX !== null && touchY !== null) {
                const dx = touchX - player.x;
                const dy = touchY - player.y;
                player.x += Math.sign(dx) * Math.min(Math.abs(dx), speed);
                player.y += Math.sign(dy) * Math.min(Math.abs(dy), speed);
            }

            const trackWidth = canvas.width * 0.4;
            const trackStart = canvas.width * 0.3;
            player.x = Math.max(trackStart + 15, Math.min(trackStart + trackWidth - 15, player.x));
            player.y = Math.max(40, Math.min(canvas.height - 60, player.y));

            if (keys[' '] || shooting) {
                shootTimer++;
                if (shootTimer > (player.weapon === 'triple' ? 20 : 10)) {
                    shoot();
                    shootTimer = 0;
                }
            }

            if (gameState.boosting) {
                gameState.boostEnergy = Math.max(0, gameState.boostEnergy - 1);
                createParticles(player.x, player.y + 30, 2, '#00ffff');
            } else {
                gameState.boostEnergy = Math.min(gameState.maxBoostEnergy, gameState.boostEnergy + 0.3);
            }
            
            if (gameState.boostCooldown > 0) {
                gameState.boostCooldown--;
                document.getElementById('boostBtn').classList.add('cooldown');
            } else {
                document.getElementById('boostBtn').classList.remove('cooldown');
            }

            if (gameState.shield < gameState.maxShield) {
                gameState.shield = Math.min(gameState.maxShield, gameState.shield + 0.1);
            }

            if (frame % 80 === 0) spawnObstacle();
            if (frame % 300 === 0) {
                spawnPowerUp(trackStart + Math.random() * trackWidth, -30);
            }

            bullets = bullets.filter(b => {
                b.y -= b.speed;
                return b.y > -20;
            });

            obstacles = obstacles.filter(obs => {
                obs.y += gameState.scrollSpeed + (gameState.boosting ? 2 : 0);

                for (let i = bullets.length - 1; i >= 0; i--) {
                    if (checkCollision(bullets[i], obs)) {
                        obs.hp -= bullets[i].damage;
                        createParticles(bullets[i].x, bullets[i].y, 5, '#ffff00');
                        bullets.splice(i, 1);
                        
                        if (obs.hp <= 0) {
                            createExplosion(obs.x + obs.width/2, obs.y + obs.height/2, true);
                            gameState.score += obs.type === 'armored' ? 200 : 100;
                            
                            if (Math.random() > 0.7) {
                                spawnPowerUp(obs.x + obs.width/2, obs.y + obs.height/2);
                            }
                            return false;
                        }
                    }
                }

                if (checkCollision(obs, player)) {
                    if (gameState.shield > 0) {
                        gameState.shield -= 20;
                        createExplosion(obs.x + obs.width/2, obs.y + obs.height/2);
                        return false;
                    } else {
                        endGame();
                        return false;
                    }
                }

                return obs.y < canvas.height + 50;
            });

            powerUps = powerUps.filter(pu => {
                pu.y += 2;
                pu.rotation += 0.1;

                if (checkCollision(pu, player)) {
                    powerUpSound();
                    createParticles(pu.x, pu.y, 10, '#ffff00');
                    
                    if (pu.type === 'shield') {
                        gameState.shield = Math.min(gameState.maxShield, gameState.shield + 50);
                    } else if (pu.type === 'boost') {
                        gameState.boostEnergy = gameState.maxBoostEnergy;
                    } else if (pu.type === 'weapon') {
                        player.weapon = 'triple';
                        setTimeout(() => { player.weapon = 'normal'; }, 5000);
                    }
                    return false;
                }

                return pu.y < canvas.height + 30;
            });

            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                return p.life > 0;
            });

            explosions = explosions.filter(exp => {
                exp.frame++;
                return exp.frame < exp.maxFrame;
            });

            document.getElementById('score').textContent = gameState.score;
            document.getElementById('shieldBar').style.width = (gameState.shield / gameState.maxShield * 100) + '%';
            document.getElementById('boostBar').style.width = (gameState.boostEnergy / gameState.maxBoostEnergy * 100) + '%';
        }

        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const trackWidth = canvas.width * 0.4;
            const trackStart = canvas.width * 0.3;
            
            ctx.fillStyle = '#4488ff';
            ctx.fillRect(trackStart, 0, trackWidth, canvas.height);

            ctx.fillStyle = '#0044aa';
            for (let y = (gameState.scrollY % 40) - 40; y < canvas.height; y += 40) {
                ctx.fillRect(trackStart + trackWidth/2 - 2, y, 4, 20);
            }

            for (let x = 0; x < trackStart; x += 16) {
                for (let y = 0; y < canvas.height; y += 16) {
                    ctx.fillStyle = ((x + y + Math.floor(gameState.scrollY / 8)) % 32 < 16) ? '#0000aa' : '#000066';
                    ctx.fillRect(x, y, 16, 16);
                }
            }
            
            for (let x = trackStart + trackWidth; x < canvas.width; x += 16) {
                for (let y = 0; y < canvas.height; y += 16) {
                    ctx.fillStyle = ((x + y + Math.floor(gameState.scrollY / 8)) % 32 < 16) ? '#0000aa' : '#000066';
                    ctx.fillRect(x, y, 16, 16);
                }
            }

            ctx.fillStyle = '#ffff00';
            bullets.forEach(b => ctx.fillRect(b.x - 2, b.y, 4, 12));

            obstacles.forEach(drawObstacle);
            powerUps.forEach(drawPowerUp);

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x, p.y, 3, 3);
            });
            ctx.globalAlpha = 1;

            explosions.forEach(exp => {
                const progress = exp.frame / exp.maxFrame;
                const size = exp.size * (1 - progress);
                ctx.fillStyle = exp.frame < exp.maxFrame/2 ? '#ffff00' : '#ff6600';
                ctx.fillRect(exp.x - size/2, exp.y - size/2, size, size);
            });

            if (!gameState.gameOver) {
                drawPlayer();
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameState.gameOver = true;
            bgMusicPlaying = false;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('finalScore').textContent = 'PONTUAÇÃO: ' + gameState.score;
        }

        function restartGame() {
            gameState = {
                score: 0,
                gameOver: false,
                scrollY: 0,
                scrollSpeed: 3,
                shield: 100,
                maxShield: 100,
                boostEnergy: 100,
                maxBoostEnergy: 100,
                boosting: false,
                boostCooldown: 0
            };
            
            const trackWidth = canvas.width * 0.4;
            const trackStart = canvas.width * 0.3;
            player.x = trackStart + trackWidth / 2;
            player.y = canvas.height - 120;
            player.weapon = 'normal';
            
            bullets = [];
            obstacles = [];
            powerUps = [];
            particles = [];
            explosions = [];
            frame = 0;
            shootTimer = 0;
            bgMusicPlaying = false;
            
            document.getElementById('score').textContent = '0';
            document.getElementById('shieldBar').style.width = '100%';
            document.getElementById('boostBar').style.width = '100%';
            document.getElementById('gameOver').style.display = 'none';
        }

        const trackWidth = canvas.width * 0.4;
        const trackStart = canvas.width * 0.3;
        player.x = trackStart + trackWidth / 2;
        player.y = canvas.height - 120;
        
        gameLoop();
    </script>
</body>
</html>

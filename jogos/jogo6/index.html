<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomberman Classic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #2a2a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            background: #000;
            padding: 20px;
        }
        canvas {
            display: block;
            background: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 4px solid #fff;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 40px;
            border: 6px solid #ff6600;
            color: #fff;
            text-align: center;
            display: none;
            z-index: 20;
            border-radius: 10px;
        }
        #gameOver h2 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #ff6600;
        }
        #gameOver button {
            background: #ff6600;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            margin-top: 20px;
            color: #fff;
            font-weight: bold;
            border-radius: 5px;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            z-index: 15;
        }
        .control-pad {
            position: relative;
            width: 180px;
            height: 180px;
        }
        .control-btn {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.3);
            border: 3px solid rgba(255,255,255,0.8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            user-select: none;
            touch-action: none;
            font-weight: bold;
        }
        .control-btn:active {
            background: rgba(255,255,255,0.6);
        }
        #upBtn { top: 0; left: 60px; }
        #downBtn { bottom: 0; left: 60px; }
        #leftBtn { top: 60px; left: 0; }
        #rightBtn { top: 60px; right: 0; }
        #bombBtn {
            position: absolute;
            right: -120px;
            top: 60px;
            width: 80px;
            height: 80px;
            background: rgba(255,100,100,0.5);
            border: 4px solid rgba(255,100,100,0.9);
            border-radius: 50%;
            font-size: 30px;
        }
        @media (max-width: 768px) {
            .controls {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="gameOver">
            <h2>GAME OVER</h2>
            <div id="finalStats"></div>
            <button onclick="restartGame()">PLAY AGAIN</button>
        </div>
        <div class="controls">
            <div class="control-pad">
                <div class="control-btn" id="upBtn">↑</div>
                <div class="control-btn" id="downBtn">↓</div>
                <div class="control-btn" id="leftBtn">←</div>
                <div class="control-btn" id="rightBtn">→</div>
                <div class="control-btn" id="bombBtn">💣</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 560;
        canvas.height = 560;
        
        function resizeCanvas() {
            const maxSize = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.85, 700);
            canvas.style.width = maxSize + 'px';
            canvas.style.height = maxSize + 'px';
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Sistema de Som
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(freq, duration, type = 'square') {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // Constantes
        const TILE = 40;
        const GRID_W = 14;
        const GRID_H = 13;

        // Game State
        let gameState = {
            score: 0,
            lives: 2,
            time: 200,
            gameOver: false,
            level: 1
        };

        // Player
        let player = {
            gridX: 1,
            gridY: 1,
            x: 1 * TILE + TILE/2,
            y: 1 * TILE + TILE/2,
            targetX: 1 * TILE + TILE/2,
            targetY: 1 * TILE + TILE/2,
            speed: 2.5,
            bombCount: 1,
            bombRange: 2,
            activeBombs: 0,
            isMoving: false
        };

        // Grid
        let grid = [];
        let bombs = [];
        let explosions = [];
        let powerUps = [];
        let enemies = [];

        const EMPTY = 0;
        const WALL = 1;
        const BRICK = 2;

        // Inicializar Grid
        function initGrid() {
            grid = [];
            for (let y = 0; y < GRID_H; y++) {
                grid[y] = [];
                for (let x = 0; x < GRID_W; x++) {
                    // Bordas
                    if (y === 0 || x === 0 || x === GRID_W - 1 || y === GRID_H - 1) {
                        grid[y][x] = WALL;
                    }
                    // Paredes fixas (padrão xadrez)
                    else if (x % 2 === 0 && y % 2 === 0) {
                        grid[y][x] = WALL;
                    }
                    // Área inicial do jogador (espaço livre)
                    else if ((x <= 2 && y <= 2)) {
                        grid[y][x] = EMPTY;
                    }
                    // Blocos destrutíveis
                    else if (Math.random() > 0.25) {
                        grid[y][x] = BRICK;
                    } else {
                        grid[y][x] = EMPTY;
                    }
                }
            }
        }

        // Spawn Inimigos
        function spawnEnemies() {
            enemies = [];
            const count = 3 + gameState.level;
            for (let i = 0; i < count; i++) {
                let x, y;
                let attempts = 0;
                do {
                    x = Math.floor(Math.random() * (GRID_W - 4)) + 2;
                    y = Math.floor(Math.random() * (GRID_H - 4)) + 2;
                    attempts++;
                } while ((grid[y][x] !== EMPTY || (x < 5 && y < 5)) && attempts < 100);
                
                if (attempts < 100) {
                    enemies.push({
                        gridX: x,
                        gridY: y,
                        x: x * TILE + TILE/2,
                        y: y * TILE + TILE/2,
                        targetX: x * TILE + TILE/2,
                        targetY: y * TILE + TILE/2,
                        speed: 1 + Math.random() * 0.5,
                        moveTimer: 0,
                        isMoving: false
                    });
                }
            }
        }

        // Controles
        const keys = {};
        
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') e.preventDefault();
            keys[e.key] = true;
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Botões Mobile
        let touchControls = {
            up: false, down: false, left: false, right: false
        };

        ['upBtn', 'downBtn', 'leftBtn', 'rightBtn'].forEach(id => {
            const btn = document.getElementById(id);
            const dir = id.replace('Btn', '');
            
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                touchControls[dir] = true;
            });
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                touchControls[dir] = false;
            });
        });

        let bombCooldown = false;
        document.getElementById('bombBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!bombCooldown) {
                placeBomb();
                bombCooldown = true;
                setTimeout(() => bombCooldown = false, 300);
            }
        });

        // Movimento do Jogador
        function movePlayer() {
            if (gameState.gameOver) return;

            // Se não está se movendo, aceitar nova direção
            if (!player.isMoving) {
                let dx = 0, dy = 0;
                
                if (keys['ArrowUp'] || keys['w'] || touchControls.up) dy = -1;
                else if (keys['ArrowDown'] || keys['s'] || touchControls.down) dy = 1;
                else if (keys['ArrowLeft'] || keys['a'] || touchControls.left) dx = -1;
                else if (keys['ArrowRight'] || keys['d'] || touchControls.right) dx = 1;

                if (dx !== 0 || dy !== 0) {
                    const newGridX = player.gridX + dx;
                    const newGridY = player.gridY + dy;
                    
                    if (canMoveTo(newGridX, newGridY)) {
                        player.isMoving = true;
                        player.gridX = newGridX;
                        player.gridY = newGridY;
                        player.targetX = newGridX * TILE + TILE/2;
                        player.targetY = newGridY * TILE + TILE/2;
                    }
                }
                
                // Bomba
                if (keys[' ']) {
                    keys[' '] = false;
                    placeBomb();
                }
            }

            // Mover suavemente em direção ao alvo
            if (player.isMoving) {
                const dx = player.targetX - player.x;
                const dy = player.targetY - player.y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                
                if (distance < player.speed) {
                    player.x = player.targetX;
                    player.y = player.targetY;
                    player.isMoving = false;
                    
                    // Coletar power-ups
                    checkPowerUps();
                } else {
                    player.x += (dx / distance) * player.speed;
                    player.y += (dy / distance) * player.speed;
                }
            }
        }

        function canMoveTo(gridX, gridY) {
            if (gridX < 0 || gridX >= GRID_W || gridY < 0 || gridY >= GRID_H) return false;
            if (grid[gridY][gridX] !== EMPTY) return false;
            if (bombs.some(b => b.gridX === gridX && b.gridY === gridY)) return false;
            return true;
        }

        function checkPowerUps() {
            powerUps = powerUps.filter(pu => {
                if (pu.gridX === player.gridX && pu.gridY === player.gridY) {
                    if (pu.type === 'bomb') player.bombCount++;
                    if (pu.type === 'fire') player.bombRange++;
                    playSound(600, 0.2, 'sine');
                    gameState.score += 100;
                    return false;
                }
                return true;
            });
        }

        // Colocar Bomba
        function placeBomb() {
            if (gameState.gameOver) return;
            if (player.activeBombs >= player.bombCount) return;
            if (bombs.some(b => b.gridX === player.gridX && b.gridY === player.gridY)) return;
            
            bombs.push({
                gridX: player.gridX,
                gridY: player.gridY,
                x: player.gridX * TILE + TILE/2,
                y: player.gridY * TILE + TILE/2,
                timer: 150,
                range: player.bombRange
            });
            
            player.activeBombs++;
            playSound(300, 0.1);
        }

        // Atualizar Bombas
        function updateBombs() {
            for (let i = bombs.length - 1; i >= 0; i--) {
                bombs[i].timer--;
                if (bombs[i].timer <= 0) {
                    explodeBomb(bombs[i]);
                    bombs.splice(i, 1);
                    player.activeBombs--;
                }
            }
        }

        // Explosão
        function explodeBomb(bomb) {
            playSound(150, 0.3, 'sawtooth');
            
            const expList = [];
            expList.push({ gridX: bomb.gridX, gridY: bomb.gridY });

            const dirs = [[0,-1], [0,1], [-1,0], [1,0]];
            
            for (let [dx, dy] of dirs) {
                for (let i = 1; i <= bomb.range; i++) {
                    const x = bomb.gridX + dx * i;
                    const y = bomb.gridY + dy * i;
                    
                    if (x < 0 || x >= GRID_W || y < 0 || y >= GRID_H) break;
                    if (grid[y][x] === WALL) break;
                    
                    expList.push({ gridX: x, gridY: y });
                    
                    if (grid[y][x] === BRICK) {
                        grid[y][x] = EMPTY;
                        gameState.score += 10;
                        
                        if (Math.random() > 0.7) {
                            powerUps.push({
                                gridX: x,
                                gridY: y,
                                type: Math.random() > 0.5 ? 'bomb' : 'fire'
                            });
                        }
                        break;
                    }
                }
            }
            
            expList.forEach(exp => {
                explosions.push({
                    gridX: exp.gridX,
                    gridY: exp.gridY,
                    timer: 30
                });
            });
        }

        // Atualizar Explosões
        function updateExplosions() {
            for (let i = explosions.length - 1; i >= 0; i--) {
                explosions[i].timer--;
                
                // Dano ao jogador
                if (player.gridX === explosions[i].gridX && player.gridY === explosions[i].gridY) {
                    playerDie();
                }
                
                // Dano aos inimigos
                enemies = enemies.filter(e => {
                    if (e.gridX === explosions[i].gridX && e.gridY === explosions[i].gridY) {
                        gameState.score += 200;
                        playSound(400, 0.2);
                        return false;
                    }
                    return true;
                });
                
                if (explosions[i].timer <= 0) {
                    explosions.splice(i, 1);
                }
            }
        }

        // Atualizar Inimigos
        function updateEnemies() {
            enemies.forEach(enemy => {
                if (!enemy.isMoving) {
                    enemy.moveTimer++;
                    if (enemy.moveTimer > 30) {
                        const dirs = [[0,-1], [0,1], [-1,0], [1,0]];
                        const validDirs = dirs.filter(([dx, dy]) => {
                            const newX = enemy.gridX + dx;
                            const newY = enemy.gridY + dy;
                            return canMoveTo(newX, newY);
                        });
                        
                        if (validDirs.length > 0) {
                            const [dx, dy] = validDirs[Math.floor(Math.random() * validDirs.length)];
                            enemy.gridX += dx;
                            enemy.gridY += dy;
                            enemy.targetX = enemy.gridX * TILE + TILE/2;
                            enemy.targetY = enemy.gridY * TILE + TILE/2;
                            enemy.isMoving = true;
                        }
                        enemy.moveTimer = 0;
                    }
                }
                
                if (enemy.isMoving) {
                    const dx = enemy.targetX - enemy.x;
                    const dy = enemy.targetY - enemy.y;
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    
                    if (distance < enemy.speed) {
                        enemy.x = enemy.targetX;
                        enemy.y = enemy.targetY;
                        enemy.isMoving = false;
                    } else {
                        enemy.x += (dx / distance) * enemy.speed;
                        enemy.y += (dy / distance) * enemy.speed;
                    }
                }
                
                // Colisão com jogador
                if (enemy.gridX === player.gridX && enemy.gridY === player.gridY) {
                    playerDie();
                }
            });
        }

        function playerDie() {
            playSound(100, 0.5, 'triangle');
            gameState.lives--;
            if (gameState.lives < 0) {
                endGame(false);
            } else {
                player.gridX = 1;
                player.gridY = 1;
                player.x = 1 * TILE + TILE/2;
                player.y = 1 * TILE + TILE/2;
                player.targetX = player.x;
                player.targetY = player.y;
                player.isMoving = false;
            }
        }

        // Timer
        let frameCount = 0;
        function updateTimer() {
            frameCount++;
            if (frameCount >= 60) {
                gameState.time--;
                frameCount = 0;
                
                if (gameState.time <= 0) {
                    endGame(false);
                }
            }
        }

        // Update
        function update() {
            if (gameState.gameOver) return;
            
            movePlayer();
            updateBombs();
            updateExplosions();
            updateEnemies();
            updateTimer();
            
            if (enemies.length === 0) {
                endGame(true);
            }
        }

        // Desenhar
        function draw() {
            // Background
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Interface superior
            ctx.fillStyle = '#888';
            ctx.fillRect(0, 0, canvas.width, TILE);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Courier New';
            ctx.fillText('TIME ' + gameState.time, 20, 25);
            ctx.fillText(String(gameState.score).padStart(8, '0'), canvas.width/2 - 40, 25);
            ctx.fillText('LEFT ' + gameState.lives, canvas.width - 100, 25);
            
            // Grid
            for (let y = 0; y < GRID_H; y++) {
                for (let x = 0; x < GRID_W; x++) {
                    const px = x * TILE;
                    const py = y * TILE + TILE;
                    
                    if (grid[y][x] === EMPTY) {
                        ctx.fillStyle = '#00aa00';
                        ctx.fillRect(px, py, TILE, TILE);
                    } else if (grid[y][x] === WALL) {
                        ctx.fillStyle = '#888';
                        ctx.fillRect(px, py, TILE, TILE);
                        ctx.fillStyle = '#666';
                        ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
                    } else if (grid[y][x] === BRICK) {
                        ctx.fillStyle = '#888';
                        ctx.fillRect(px, py, TILE, TILE);
                        ctx.fillStyle = '#aaa';
                        ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 6);
                        ctx.fillStyle = '#777';
                        ctx.fillRect(px + 8, py + 12, TILE - 16, 4);
                        ctx.fillRect(px + 8, py + 24, TILE - 16, 4);
                    }
                }
            }
            
            // Power-ups
            powerUps.forEach(pu => {
                const px = pu.gridX * TILE;
                const py = pu.gridY * TILE + TILE;
                
                ctx.fillStyle = pu.type === 'bomb' ? '#000' : '#ff6600';
                ctx.fillRect(px + 10, py + 10, TILE - 20, TILE - 20);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(pu.type === 'bomb' ? 'B' : 'F', px + TILE/2, py + TILE/2 + 7);
            });
            
            // Bombas
            bombs.forEach(bomb => {
                const px = bomb.x - 14;
                const py = bomb.y - 14 + TILE;
                const blink = bomb.timer % 20 < 10;
                
                ctx.fillStyle = blink ? '#000' : '#333';
                ctx.beginPath();
                ctx.arc(bomb.x, bomb.y + TILE, 14, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#ff0';
                ctx.beginPath();
                ctx.arc(bomb.x - 5, bomb.y + TILE - 10, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Explosões
            explosions.forEach(exp => {
                const px = exp.gridX * TILE;
                const py = exp.gridY * TILE + TILE;
                const alpha = exp.timer / 30;
                
                ctx.fillStyle = exp.timer > 15 ? `rgba(255,255,100,${alpha})` : `rgba(255,150,50,${alpha})`;
                ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
            });
            
            // Inimigos
            enemies.forEach(enemy => {
                ctx.fillStyle = '#ff6600';
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y + TILE, 15, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(enemy.x - 5, enemy.y + TILE - 3, 3, 0, Math.PI * 2);
                ctx.arc(enemy.x + 5, enemy.y + TILE - 3, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Jogador
            if (!gameState.gameOver) {
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(player.x, player.y + TILE, 14, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#4488ff';
                ctx.beginPath();
                ctx.arc(player.x, player.y + TILE, 10, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.fillRect(player.x - 4, player.y + TILE - 3, 3, 3);
                ctx.fillRect(player.x + 1, player.y + TILE - 3, 3, 3);
            }
        }

        // Game Loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // End Game
        function endGame(won) {
            gameState.gameOver = true;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('finalStats').innerHTML = 
                (won ? '<div style="color:#0f0; font-size:28px; margin-bottom:10px;">VOCÊ VENCEU!</div>' : '<div style="color:#f00; font-size:28px; margin-bottom:10px;">VOCÊ PERDEU!</div>') +
                `<div>Pontuação: ${gameState.score}</div>` +
                `<div>Tempo: ${gameState.time}s</div>`;
        }

        // Restart
        function restartGame() {
            gameState = {
                score: 0,
                lives: 2,
                time: 200,
                gameOver: false,
                level: 1
            };
            
            player = {
                gridX: 1,
                gridY: 1,
                x: 1 * TILE + TILE/2,
                y: 1 * TILE + TILE/2,
                targetX: 1 * TILE + TILE/2,
                targetY: 1 * TILE + TILE/2,
                speed: 2.5,
                bombCount: 1,
                bombRange: 2,
                activeBombs: 0,
                isMoving: false
            };
            
            bombs = [];
            explosions = [];
            powerUps = [];
            frameCount = 0;
            
            initGrid();
            spawnEnemies();
            
            document.getElementById('gameOver').style.display = 'none';
        }

        // Iniciar
        initGrid();
        spawnEnemies();
        gameLoop();
    </script>
</body>
</html>

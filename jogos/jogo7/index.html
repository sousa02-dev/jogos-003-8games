<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aventura Mágica no Jardim</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #2b6b2b;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* TELA INICIAL */
#start-screen {
    position: absolute;
    inset: 0;
    background: linear-gradient(#5bbf5b, #2b6b2b);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    color: #fff;
}

#start-screen h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

#start-screen p {
    margin-bottom: 20px;
}

#btnStart {
    font-size: 22px;
    padding: 14px 30px;
    border: none;
    background: #ffcc00;
    color: #000;
    border-radius: 10px;
    cursor: pointer;
}

/* HUD */
#hud {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #fff;
    z-index: 5;
}

#hud span {
    margin-right: 15px;
}

/* TABULEIRO */
#game {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 4px;
    width: 90vmin;
    height: 90vmin;
    margin: auto;
    margin-top: 60px;
}

.tile {
    background: rgba(255,255,255,0.9);
    border-radius: 12px;
    font-size: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
}

/* ANIMAÇÃO */
.tile.match {
    animation: pop 0.3s;
}

@keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<!-- TELA INICIAL -->
<div id="start-screen">
    <h1>🌸 Aventura Mágica no Jardim 🌸</h1>
    <p>Ajude o cachorrinho a escapar da ilha mágica!</p>
    <button id="btnStart">▶ INICIAR</button>
</div>

<!-- HUD -->
<div id="hud">
    <span>🐶 Cachorrinho</span>
    <span>Pontos: <b id="score">0</b></span>
    <span>Nível: <b id="level">1</b></span>
</div>

<!-- JOGO -->
<div id="game"></div>

<!-- SONS -->
<audio id="sndMatch" src="https://cdn.pixabay.com/audio/2022/03/15/audio_1b3c9fdb1a.mp3"></audio>
<audio id="sndFail" src="https://cdn.pixabay.com/audio/2022/03/10/audio_2a84f1e1a4.mp3"></audio>
<audio id="sndWin" src="https://cdn.pixabay.com/audio/2022/03/15/audio_8e20d8f63d.mp3"></audio>

<script>
/* FULLSCREEN */
function enterFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}

/* CONFIGURAÇÃO */
const size = 8;
const symbols = ["🍎","🍋","🍇","🍓","🍀","💧","🌸"];
let board = [];
let selected = null;
let score = 0;
let level = 1;

const game = document.getElementById("game");
const scoreEl = document.getElementById("score");
const levelEl = document.getElementById("level");

/* INICIAR */
document.getElementById("btnStart").onclick = () => {
    enterFullscreen();
    document.getElementById("start-screen").style.display = "none";
    initBoard();
};

/* CRIAR TABULEIRO */
function initBoard() {
    game.innerHTML = "";
    board = [];

    for (let i = 0; i < size * size; i++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.dataset.index = i;
        tile.textContent = randomSymbol();
        tile.onclick = () => selectTile(tile);
        board.push(tile);
        game.appendChild(tile);
    }
}

/* SÍMBOLO ALEATÓRIO */
function randomSymbol() {
    return symbols[Math.floor(Math.random() * symbols.length)];
}

/* SELEÇÃO */
function selectTile(tile) {
    if (!selected) {
        selected = tile;
        tile.style.outline = "3px solid red";
    } else {
        swap(selected, tile);
        selected.style.outline = "";
        selected = null;
        checkMatches();
    }
}

/* TROCA */
function swap(a, b) {
    const temp = a.textContent;
    a.textContent = b.textContent;
    b.textContent = temp;
}

/* CHECAR MATCH 3 */
function checkMatches() {
    let matched = false;

    // horizontal
    for (let r = 0; r < size; r++) {
        for (let c = 0; c < size - 2; c++) {
            const i = r * size + c;
            const s = board[i].textContent;
            if (s &&
                s === board[i+1].textContent &&
                s === board[i+2].textContent) {
                clearMatch([i, i+1, i+2]);
                matched = true;
            }
        }
    }

    // vertical
    for (let c = 0; c < size; c++) {
        for (let r = 0; r < size - 2; r++) {
            const i = r * size + c;
            const s = board[i].textContent;
            if (s &&
                s === board[i+size].textContent &&
                s === board[i+size*2].textContent) {
                clearMatch([i, i+size, i+size*2]);
                matched = true;
            }
        }
    }

    if (!matched) {
        document.getElementById("sndFail").play();
    }
}

/* LIMPAR */
function clearMatch(indexes) {
    indexes.forEach(i => {
        board[i].classList.add("match");
        board[i].textContent = "";
    });

    document.getElementById("sndMatch").play();
    score += 100;
    scoreEl.textContent = score;

    setTimeout(refill, 300);

    if (score >= level * 1000) {
        level++;
        levelEl.textContent = level;
        document.getElementById("sndWin").play();
    }
}

/* REPOSIÇÃO */
function refill() {
    board.forEach(tile => {
        if (tile.textContent === "") {
            tile.textContent = randomSymbol();
            tile.classList.remove("match");
        }
    });
}
</script>

</body>
</html>
